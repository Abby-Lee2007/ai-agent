services:
  - type: web
    name: ai-banking-agent
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_api.py --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FINAGENT_LLM_MODE
        value: "auto"
      - key: FINAGENT_MARKET_MODE
        value: "live"
      - key: FINAGENT_WEB_PASSWORD
        sync: false
      - key: FINAGENT_WEBHOOK_SECRET
        sync: false
