<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Banking Agent</title>
  <style>
    :root {
      --bg: #f2f5f3;
      --surface: #ffffff;
      --surface-soft: #f7f9f8;
      --ink: #1c2a28;
      --muted: #667572;
      --line: #dce5e2;
      --accent: #0b6b5f;
      --accent-strong: #075248;
      --accent-soft: #e4f1ed;
      --warning: #8a5b16;
      --warning-soft: #fff4dd;
      --danger: #a9362c;
      --shadow: 0 14px 40px rgba(25, 54, 49, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font: 15px/1.55 "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }
    button, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(1180px, calc(100% - 32px));
      height: calc(100dvh - 32px);
      margin: 16px auto;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
    }
    .brand, .brand-copy, .status, .session-state { display: flex; align-items: center; }
    .brand { gap: 12px; min-width: 0; }
    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .brand-copy { align-items: flex-start; flex-direction: column; line-height: 1.2; min-width: 0; }
    .brand-copy strong { font-size: 16px; }
    .brand-copy span { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .status { gap: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2f9c79;
      box-shadow: 0 0 0 4px #e4f4ee;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 268px minmax(0, 1fr);
    }

    .sidebar {
      min-height: 0;
      padding: 18px;
      border-right: 1px solid var(--line);
      background: var(--surface-soft);
      overflow-y: auto;
    }
    .side-section + .side-section { margin-top: 22px; }
    .side-label {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .customer {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    .customer strong { display: block; font-size: 15px; }
    .customer span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .session-state {
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    .session-state code {
      max-width: 142px;
      overflow: hidden;
      color: var(--accent-strong);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .quick-list { display: grid; gap: 7px; }
    .quick {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: var(--surface);
      text-align: left;
      transition: border-color .16s ease, background .16s ease;
    }
    .quick:hover, .quick:focus-visible {
      border-color: #9ec7bd;
      background: var(--accent-soft);
      outline: none;
    }

    .guide {
      margin: 0;
      padding-left: 17px;
      color: var(--muted);
      font-size: 12px;
    }
    .guide li + li { margin-top: 6px; }

    .chat {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      background: #fbfcfc;
    }
    .messages {
      min-height: 0;
      padding: 22px clamp(16px, 3vw, 32px);
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    .message {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      align-items: flex-start;
    }
    .message.user { justify-content: flex-end; }
    .avatar {
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 10px;
      font-weight: 800;
    }
    .message.user .avatar { order: 2; background: #e9eceb; color: #4b5b58; }
    .bubble {
      max-width: min(760px, 82%);
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(31, 59, 54, .04);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message.user .bubble {
      border-color: #c9d9d5;
      background: #e8f2ef;
    }
    .message-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
    }
    .kind {
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent-strong);
      background: var(--accent-soft);
      font-weight: 700;
    }
    .kind.confirm, .kind.verify, .kind.question {
      color: var(--warning);
      background: var(--warning-soft);
    }
    .kind.error {
      color: var(--danger);
      background: #fdecea;
    }
    .trace {
      margin-top: 10px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .trace summary { cursor: pointer; user-select: none; }
    .trace-row {
      margin-top: 7px;
      padding: 7px 8px;
      border-radius: 5px;
      background: var(--surface-soft);
      overflow-wrap: anywhere;
    }
    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
    }
    .typing i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #7fa49d;
      animation: pulse 1s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: .14s; }
    .typing i:nth-child(3) { animation-delay: .28s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: .3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }

    .composer-area {
      padding: 12px clamp(16px, 3vw, 32px) 16px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    .composer {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
      padding: 9px;
      border: 1px solid #bdcfca;
      border-radius: 8px;
      background: var(--surface);
    }
    textarea {
      width: 100%;
      min-height: 42px;
      max-height: 132px;
      padding: 8px 9px;
      border: 0;
      resize: none;
      color: var(--ink);
      background: transparent;
      outline: none;
    }
    textarea::placeholder { color: #8a9996; }
    .attach {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
    }
    .attach:hover, .attach:focus-visible {
      color: var(--accent-strong);
      background: var(--accent-soft);
      outline: none;
    }
    .send {
      min-width: 74px;
      height: 40px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: var(--accent);
      font-weight: 700;
    }
    .send:hover { background: var(--accent-strong); }
    .send:disabled { cursor: wait; opacity: .55; }
    .composer-note {
      margin: 7px 2px 0;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }
    .drop-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(11, 107, 95, .12);
      border: 2px dashed var(--accent);
    }
    .drop-overlay.show { display: grid; }
    .drop-panel {
      max-width: 420px;
      padding: 24px 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      text-align: center;
      box-shadow: var(--shadow);
    }
    .drop-panel strong { display: block; margin-bottom: 6px; }
    .drop-panel span { color: var(--muted); font-size: 13px; }

    @media (max-width: 760px) {
      .app {
        width: 100%;
        height: 100dvh;
        margin: 0;
        border: 0;
        border-radius: 0;
      }
      .topbar { min-height: 60px; padding: 10px 14px; }
      .brand-copy span { display: none; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
      .sidebar {
        padding: 10px 14px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        overflow: visible;
      }
      .customer, .side-section:not(:first-child) { display: none; }
      .sidebar .side-section:first-child { margin: 0; }
      .side-label { display: none; }
      .quick-list {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .quick { width: auto; flex: 0 0 auto; white-space: nowrap; }
      .messages { padding: 16px 12px; }
      .bubble { max-width: 88%; }
      .composer-area { padding: 9px 12px max(10px, env(safe-area-inset-bottom)); }
      .send { min-width: 62px; }
      .composer-note { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">FA</div>
        <div class="brand-copy">
          <strong>AI Banking Agent</strong>
          <span>智能银行代理系统</span>
        </div>
      </div>
      <div class="status"><span class="status-dot"></span><span id="service-status">接口就绪</span></div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <section class="side-section">
          <p class="side-label">当前会话</p>
          <div class="customer">
            <strong>陈晓明</strong>
            <span>模拟客户 · 平衡型投资者</span>
            <div class="session-state">
              <span>会话</span>
              <code id="session-id">正在创建</code>
            </div>
          </div>
        </section>

        <section class="side-section">
          <p class="side-label">快捷指令</p>
          <div class="quick-list">
            <button class="quick" data-prompt="我还有多少钱">查询总资产</button>
            <button class="quick" data-prompt="分析我这个月的账单">分析本月账单</button>
            <button class="quick" data-prompt="推荐几个稳健的理财产品">筛选理财产品</button>
            <button class="quick" data-prompt="我有哪些卡">管理银行卡</button>
            <button class="quick" data-prompt="帮我看看有哪些自动续费">检查自动续费</button>
            <button class="quick" data-prompt="我老婆快生日了，帮我准备一下">准备生日惊喜</button>
          </div>
        </section>

        <section class="side-section">
          <p class="side-label">操作说明</p>
          <ul class="guide">
            <li>涉及资金变动时会先要求确认。</li>
            <li>大额操作需要输入演示验证码。</li>
            <li>直接输入“确认”或“取消”继续流程。</li>
          </ul>
        </section>
      </aside>

      <main class="chat">
        <div class="messages" id="messages" aria-live="polite">
          <article class="message agent">
            <div class="avatar">FA</div>
            <div class="bubble">
              <div class="message-meta"><span class="kind">就绪</span><span>在线助手</span></div>
              您好，我是 AI Banking Agent。可以直接说“给老婆转2000块”“分析本月账单”或“帮我准备生日惊喜”。
            </div>
          </article>
        </div>

        <div class="composer-area">
          <form class="composer" id="composer">
            <button class="attach" id="upload-button" type="button" title="上传账单截图或账单文件" aria-label="上传账单">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4.5" width="18" height="15" rx="2.5"></rect>
                <circle cx="8.5" cy="9.5" r="1.4"></circle>
                <path d="M21 15.5l-4.6-4.6L5.5 21"></path>
              </svg>
            </button>
            <input id="file-input" type="file" accept="image/*,.txt,.csv" hidden>
            <textarea id="message-input" rows="1" maxlength="4000" placeholder="输入银行业务需求，Enter 发送，Shift+Enter 换行"></textarea>
            <button class="send" id="send-button" type="submit">发送</button>
          </form>
          <p class="composer-note">所有账户与交易均为模拟数据，不接入真实银行系统。</p>
        </div>
      </main>
    </div>
  </div>

  <div class="drop-overlay" id="drop-overlay">
    <div class="drop-panel">
      <strong>松开以上传账单</strong>
      <span>支持 PNG、JPG、WEBP、TXT、CSV，单文件不超过 8MB</span>
    </div>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("composer");
    const input = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const sessionLabel = document.getElementById("session-id");
    const serviceStatus = document.getElementById("service-status");
    const uploadButton = document.getElementById("upload-button");
    const fileInput = document.getElementById("file-input");
    const dropOverlay = document.getElementById("drop-overlay");
    let sessionId = localStorage.getItem("finagent_session_id") || "";
    let accessToken = sessionStorage.getItem("finagent_access_token") || "";
    let busy = false;

    function newRequestId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return `req-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function authHeaders(headers = {}) {
      const result = { ...headers };
      if (accessToken) result["X-Access-Token"] = accessToken;
      return result;
    }

    async function fetchWithAuth(url, options = {}) {
      const request = {
        ...options,
        headers: authHeaders(options.headers || {}),
      };
      let response = await fetch(url, request);
      if (response.status !== 401) return response;
      const entered = window.prompt("该站点已设置访问口令，请输入：");
      if (entered === null) return response;
      accessToken = entered.trim();
      sessionStorage.setItem("finagent_access_token", accessToken);
      request.headers = authHeaders(options.headers || {});
      response = await fetch(url, request);
      return response;
    }

    async function createSession() {
      const response = await fetchWithAuth("/v1/sessions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: "u_001", channel: "h5" })
      });
      if (!response.ok) throw new Error("无法创建会话");
      const data = await response.json();
      sessionId = data.session_id;
      localStorage.setItem("finagent_session_id", sessionId);
      sessionLabel.textContent = sessionId.replace("SESSION-", "").slice(0, 12);
      return data;
    }

    async function ensureSession() {
      if (sessionId) {
        sessionLabel.textContent = sessionId.replace("SESSION-", "").slice(0, 12);
        return;
      }
      await createSession();
    }

    function appendMessage(role, text, reply = null) {
      const article = document.createElement("article");
      article.className = `message ${role}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "YOU" : "FA";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (reply) {
        const meta = document.createElement("div");
        meta.className = "message-meta";
        const kind = document.createElement("span");
        kind.className = `kind ${reply.kind || ""}`.trim();
        kind.textContent = ({
          executed: "已执行", question: "需要补充", confirm: "等待确认",
          verify: "身份验证", error: "未执行", reply: "回复"
        })[reply.kind] || "回复";
        const intent = document.createElement("span");
        intent.textContent = reply.intent || "agent";
        meta.append(kind, intent);
        bubble.appendChild(meta);
      }

      const content = document.createElement("div");
      content.textContent = text;
      bubble.appendChild(content);

      if (reply && Array.isArray(reply.trace) && reply.trace.length) {
        const details = document.createElement("details");
        details.className = "trace";
        const summary = document.createElement("summary");
        summary.textContent = `工具调用 ${reply.trace.length} 项`;
        details.appendChild(summary);
        reply.trace.forEach((item) => {
          const row = document.createElement("div");
          row.className = "trace-row";
          row.textContent = `${item.ok ? "成功" : "失败"} · ${item.tool} · ${item.summary || ""}`;
          details.appendChild(row);
        });
        bubble.appendChild(details);
      }

      article.append(avatar, bubble);
      messages.appendChild(article);
      messages.scrollTop = messages.scrollHeight;
      return article;
    }

    function appendTyping() {
      const article = document.createElement("article");
      article.className = "message agent";
      article.id = "typing-message";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "FA";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = '<span class="typing"><span>正在处理</span><i></i><i></i><i></i></span>';
      article.append(avatar, bubble);
      messages.appendChild(article);
      messages.scrollTop = messages.scrollHeight;
    }

    function removeTyping() {
      document.getElementById("typing-message")?.remove();
    }

    function parseSseBlock(block) {
      let event = "message";
      const dataLines = [];
      block.split("\n").forEach((line) => {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
      });
      return { event, data: dataLines.join("\n") };
    }

    async function streamAgentReply(content) {
      const response = await fetchWithAuth("/v1/messages/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: sessionId,
          message: content,
          request_id: newRequestId()
        })
      });
      if (!response.ok || !response.body) throw new Error(`请求失败：${response.status}`);

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let finalReply = null;
      let streamError = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");
        const blocks = buffer.split("\n\n");
        buffer = blocks.pop() || "";
        for (const block of blocks) {
          if (!block.trim()) continue;
          const parsed = parseSseBlock(block);
          const data = parsed.data ? JSON.parse(parsed.data) : {};
          if (parsed.event === "message") finalReply = data.reply;
          if (parsed.event === "error") streamError = data.message || "请求处理失败";
        }
      }
      return { reply: finalReply, error: streamError };
    }

    async function sendMessage(text) {
      const content = (text || "").trim();
      if (!content || busy) return;
      busy = true;
      sendButton.disabled = true;
      serviceStatus.textContent = "正在处理";
      appendMessage("user", content);
      appendTyping();

      try {
        await ensureSession();
        let result = await streamAgentReply(content);
        if (result.error && result.error.includes("会话不存在")) {
          localStorage.removeItem("finagent_session_id");
          sessionId = "";
          await createSession();
          result = await streamAgentReply(content);
        }

        removeTyping();
        if (result.error) {
          appendMessage("agent", result.error, { kind: "error", intent: "session" });
        } else if (result.reply) {
          appendMessage("agent", result.reply.text, result.reply);
        } else {
          appendMessage("agent", "服务没有返回可显示的结果。", { kind: "error", intent: "stream" });
        }
      } catch (error) {
        removeTyping();
        appendMessage("agent", error.message || "网络请求失败", { kind: "error", intent: "network" });
      } finally {
        busy = false;
        sendButton.disabled = false;
        serviceStatus.textContent = "接口就绪";
        input.focus();
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handleFile(file) {
      if (!file || busy) return;
      const suffix = file.name.includes(".")
        ? file.name.slice(file.name.lastIndexOf(".")).toLowerCase()
        : "";
      const allowed = [".png", ".jpg", ".jpeg", ".webp", ".bmp", ".gif", ".txt", ".csv"];
      if (!allowed.includes(suffix)) {
        appendMessage("agent", "只支持 PNG、JPG、WEBP、TXT 或 CSV 账单。", {
          kind: "error", intent: "upload"
        });
        return;
      }
      if (file.size > 8 * 1024 * 1024) {
        appendMessage("agent", "文件超过 8MB，请压缩后再上传。", {
          kind: "error", intent: "upload"
        });
        return;
      }

      busy = true;
      sendButton.disabled = true;
      serviceStatus.textContent = "正在识别账单";
      appendMessage("user", `上传账单：${file.name}`);
      appendTyping();
      try {
        await ensureSession();
        const data = await fileToBase64(file);
        const response = await fetchWithAuth("/v1/uploads", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: sessionId,
            filename: file.name,
            data
          })
        });
        const payload = await response.json();
        removeTyping();
        if (!response.ok) {
          appendMessage("agent", payload.message || `上传失败：${response.status}`, {
            kind: "error", intent: "upload"
          });
        } else {
          sessionId = payload.session_id || sessionId;
          localStorage.setItem("finagent_session_id", sessionId);
          appendMessage("agent", payload.reply.text, payload.reply);
        }
      } catch (error) {
        removeTyping();
        appendMessage("agent", error.message || "上传失败，请确认服务仍在运行。", {
          kind: "error", intent: "upload"
        });
      } finally {
        fileInput.value = "";
        busy = false;
        sendButton.disabled = false;
        serviceStatus.textContent = "接口就绪";
        input.focus();
      }
    }

    uploadButton.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => handleFile(fileInput.files && fileInput.files[0]));

    let dragDepth = 0;
    function hasFiles(event) {
      return event.dataTransfer && Array.from(event.dataTransfer.types || []).includes("Files");
    }
    window.addEventListener("dragenter", (event) => {
      if (!hasFiles(event)) return;
      event.preventDefault();
      dragDepth += 1;
      dropOverlay.classList.add("show");
    });
    window.addEventListener("dragover", (event) => {
      if (!hasFiles(event)) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "copy";
    });
    window.addEventListener("dragleave", (event) => {
      if (!hasFiles(event)) return;
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) dropOverlay.classList.remove("show");
    });
    window.addEventListener("drop", (event) => {
      if (!hasFiles(event)) return;
      event.preventDefault();
      dragDepth = 0;
      dropOverlay.classList.remove("show");
      const file = event.dataTransfer.files && event.dataTransfer.files[0];
      if (file) handleFile(file);
    });
    window.addEventListener("paste", (event) => {
      const item = Array.from(event.clipboardData?.items || []).find((entry) => entry.kind === "file");
      if (!item) return;
      const file = item.getAsFile();
      if (file) {
        event.preventDefault();
        handleFile(file);
      }
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value;
      input.value = "";
      input.style.height = "auto";
      sendMessage(text);
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = `${Math.min(input.scrollHeight, 132)}px`;
    });

    document.querySelectorAll(".quick").forEach((button) => {
      button.addEventListener("click", () => sendMessage(button.dataset.prompt));
    });

    ensureSession().catch(() => {
      serviceStatus.textContent = "接口不可用";
      appendMessage("agent", "无法连接 Agent 服务，请确认 API 已启动。", { kind: "error", intent: "network" });
    });
  </script>
</body>
</html>
