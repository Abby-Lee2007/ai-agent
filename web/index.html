<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI Banking Agent · 智能银行代理</title>
<style>
  :root{
    --bg:#f4f6f7; --surface:#ffffff; --ink:#1c2321; --muted:#6b7672;
    --line:#e3e8e6; --accent:#0f766e; --accent-weak:#e6f2f0;
    --user:#1f3d38; --warn:#9a5b12; --danger:#a33a2b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:12px 18px; display:flex; align-items:center; gap:12px;
    position:sticky; top:0; z-index:5;
  }
  .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
  .title{font-weight:650;font-size:16px;line-height:1.2}
  .subtitle{font-size:12px;color:var(--muted);margin-top:2px}
  .status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:#2e9e6b}
  .reset{border:1px solid var(--line);background:#fff;color:var(--muted);
    border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
  .reset:hover{color:var(--ink);border-color:#cfd8d5}
  main{flex:1;overflow-y:auto;padding:18px 16px 8px}
  .wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .msg{display:flex;gap:10px;align-items:flex-start}
  .msg.user{flex-direction:row-reverse}
  .avatar{flex:0 0 30px;height:30px;border-radius:8px;display:grid;place-items:center;
    font-size:12px;font-weight:600;background:var(--accent-weak);color:var(--accent)}
  .msg.user .avatar{background:#e9edec;color:#44514d}
  .bubble{max-width:78%;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:11px 13px;white-space:pre-wrap;word-break:break-word;
    font-size:14px;line-height:1.62;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .msg.user .bubble{background:var(--user);border-color:var(--user);color:#f3f7f6}
  .bubble .mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  details.trace{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}
  details.trace summary{cursor:pointer;font-size:12px;color:var(--muted);outline:none}
  details.trace pre{margin:6px 0 0;white-space:pre-wrap;font-size:11.5px;color:var(--muted)}
  .chips{max-width:820px;margin:0 auto;padding:6px 16px 0;display:flex;gap:8px;
    overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#33413d;
    border-radius:999px;padding:7px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:#b9cdc8;background:var(--accent-weak)}
  footer{padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:var(--bg)}
  .composer{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
  .composer:focus-within{border-color:#9fc3bc;box-shadow:0 0 0 3px rgba(15,118,110,.08)}
  textarea{flex:1;border:0;outline:0;resize:none;max-height:140px;min-height:24px;
    font:inherit;font-size:14px;line-height:1.5;padding:6px 4px;background:transparent;color:inherit}
  button.send{border:0;background:var(--accent);color:#fff;border-radius:10px;
    padding:9px 14px;font-size:14px;cursor:pointer}
  button.send:disabled{opacity:.45;cursor:not-allowed}
  button.attach{border:0;background:transparent;color:var(--muted);padding:7px;
    border-radius:8px;cursor:pointer;display:grid;place-items:center}
  button.attach:hover{background:var(--accent-weak);color:var(--accent)}
  .note{max-width:820px;margin:8px auto 0;color:var(--muted);font-size:11.5px;text-align:center;line-height:1.5}
  .typing{font-size:13px;color:var(--muted)}
  @media (max-width:640px){
    .bubble{max-width:86%;font-size:14px}
    header{padding:10px 12px}
    .subtitle{display:none}
    main{padding:14px 10px 4px}
    .chips{padding:4px 10px 0}
  }
</style>
</head>
<body>
<header>
  <div class="logo">AI</div>
  <div>
    <div class="title">AI Banking Agent</div>
    <div class="subtitle">2026 FinTechathon · 智能银行代理（赛事原型）</div>
  </div>
  <div class="status"><span class="dot"></span>在线</div>
  <button class="reset" id="reset">重置</button>
</header>

<main id="main">
  <div class="wrap" id="chat"></div>
</main>

<div class="chips" id="chips"></div>

<footer>
  <div class="composer">
    <button class="attach" id="upload" title="上传账单截图（微信/支付宝/银行账单）">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4.5" width="18" height="15" rx="2.5"/>
        <circle cx="8.5" cy="9.5" r="1.4"/>
        <path d="M21 15.5l-4.6-4.6L5.5 21"/>
      </svg>
    </button>
    <input type="file" id="file" accept="image/*,.txt,.csv" hidden />
    <textarea id="input" rows="1" placeholder="用一句话办理业务，例如：给老婆转500块，用微信"></textarea>
    <button class="send" id="send">发送</button>
  </div>
  <div class="note">原型 Demo：账户与交易均为模拟数据，不接入真实银行系统。行情为公开接口实时数据。</div>
</footer>

<script>
const chat = document.getElementById("chat");
const main = document.getElementById("main");
const input = document.getElementById("input");
const send = document.getElementById("send");
const reset = document.getElementById("reset");
const chips = document.getElementById("chips");
const uploadBtn = document.getElementById("upload");
const fileInput = document.getElementById("file");
let session = localStorage.getItem("finagent_session") || "";
let token = sessionStorage.getItem("finagent_token") || "";
let busy = false;

async function api(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-Access-Token": token},
    body: JSON.stringify(body || {})
  });
  if (res.status === 401) {
    const entered = window.prompt("该站点已设置访问口令，请输入：");
    if (entered === null) return res;
    token = entered.trim();
    sessionStorage.setItem("finagent_token", token);
    return api(url, body);
  }
  return res;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleFile() {
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) {
    addMsg("agent", "文件超过 8MB，请压缩后再传。");
    fileInput.value = "";
    return;
  }
  addMsg("user", "上传账单：" + f.name);
  addTyping();
  busy = true; send.disabled = true;
  try {
    const data64 = await fileToBase64(f);
    const res = await api("/api/upload", {session, filename: f.name, data: data64});
    const data = await res.json();
    removeTyping();
    if (!data.ok) {
      addMsg("agent", "上传失败：" + (data.error || res.status));
    } else {
      session = data.session || session;
      localStorage.setItem("finagent_session", session);
      addMsg("agent", data.reply, data.trace);
    }
  } catch (e) {
    removeTyping();
    addMsg("agent", "上传失败，请确认服务仍在运行。");
  } finally {
    busy = false; send.disabled = false; fileInput.value = ""; input.focus();
  }
}

const QUICK = [
  ["账户总览", "我有哪些卡"],
  ["本月账单", "分析我这个月的账单"],
  ["异常交易", "帮我看看有没有异常交易"],
  ["推荐基金", "给我推荐几个基金"],
  ["转账", "给老婆转500块，用微信"],
  ["订阅", "有哪些自动续费"],
];

function addMsg(role, text, trace) {
  const row = document.createElement("div");
  row.className = "msg " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "我" : "AI";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  if (trace && trace.length) {
    const d = document.createElement("details");
    d.className = "trace";
    const s = document.createElement("summary");
    s.textContent = "工具调用（" + trace.length + "）";
    const pre = document.createElement("pre");
    pre.textContent = trace.map(t =>
      (t.ok ? "[OK] " : "[FAIL] ") + t.tool + " -> " + (t.summary || "")
    ).join("\n");
    d.appendChild(s); d.appendChild(pre); bubble.appendChild(d);
  }
  row.appendChild(avatar);
  row.appendChild(bubble);
  chat.appendChild(row);
  main.scrollTop = main.scrollHeight;
  return bubble;
}

function addTyping() {
  const row = document.createElement("div");
  row.className = "msg agent";
  row.id = "typing";
  row.innerHTML = '<div class="avatar">AI</div><div class="bubble typing">思考中…</div>';
  chat.appendChild(row);
  main.scrollTop = main.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typing");
  if (el) el.remove();
}

async function ask(message) {
  if (busy || !message.trim()) return;
  busy = true; send.disabled = true;
  addMsg("user", message);
  input.value = ""; resize();
  addTyping();
  try {
    const res = await api("/api/chat", {session, message});
    const data = await res.json();
    removeTyping();
    if (!data.ok) { addMsg("agent", "服务出错：" + (data.error || res.status)); return; }
    session = data.session || session;
    localStorage.setItem("finagent_session", session);
    addMsg("agent", data.reply, data.trace);
  } catch (e) {
    removeTyping();
    addMsg("agent", "网络异常，请确认服务仍在运行。");
  } finally {
    busy = false; send.disabled = false; input.focus();
  }
}

function resize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
}

send.addEventListener("click", () => ask(input.value));
input.addEventListener("input", resize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); }
});
uploadBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", handleFile);

reset.addEventListener("click", async () => {
  if (session) {
    await api("/api/reset", {session}).catch(() => {});
  }
  localStorage.removeItem("finagent_session");
  session = ""; chat.innerHTML = "";
  greet();
});

QUICK.forEach(([label, text]) => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = label;
  b.addEventListener("click", () => ask(text));
  chips.appendChild(b);
});

function greet() {
  addMsg("agent",
    "您好，我是 AI Banking Agent。\\n" +
    "可以直接说自然语言办理业务，例如：\\n" +
    "  · 给老婆转500块，用微信\\n" +
    "  · 分析我这个月的账单\\n" +
    "  · 给我推荐几个基金（会先做 6 题风险问卷）\\n" +
    "  · 绑定一张中国银行的卡\\n" +
    "输入「你能做什么」查看全部能力与句式模版。");
}

greet();
input.focus();
</script>
</body>
</html>
